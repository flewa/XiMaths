[project]
name = "ximaths-backend"
version = "0.1.0"
description = "API Django de XiMaths"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.4,<2",
    "dj-database-url>=3.0,<4",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<0.5",
    "sympy>=1.13,<2",
    "pyjwt[crypto]>=2.9,<3",
    "whitenoise>=6.9,<7",
    "redis>=5.2,<7",
    "anthropic>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
prod = [
    "gunicorn>=26.2.0",
    "sentry-sdk>=2.73.0",
]
